services:
  backend:
    build: ./backend
    container_name: andre-portfolio-backend
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-7020}:3000"
    volumes:
      - ./backend/data:/app/data:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: andre-portfolio-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5180}:80"
    depends_on:
      - backend
    restart: unless-stopped
