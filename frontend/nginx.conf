server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecionamentos relativos (o site está atrás do nginx do host, com HTTPS)
    absolute_redirect off;

    # Compressão: páginas mais leves = melhor Core Web Vitals (conta para o SEO)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Ficheiros com hash no nome: podem ficar em cache um ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cada página é um ficheiro HTML pré-renderizado (/en/, /projetos/caderneta/, …)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Endereços sem barra final (/en, /artigos) -> redireciona para a versão com barra (canonical)
    location ~ ^(?<p>/(?:en|projetos|artigos|en/projects|en/articles)(?:/[a-z0-9-]+)?)$ {
        return 301 $p/;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }
}
